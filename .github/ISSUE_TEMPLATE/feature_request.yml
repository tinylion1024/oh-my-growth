name: ✨ Feature Request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢您的建议！请详细描述您想要的功能。

  - type: textarea
    id: problem
    attributes:
      label: 问题背景
      description: 这个功能要解决什么问题？
      placeholder: |
        我想要...（描述您的使用场景）

        目前的问题是...（描述当前的痛点）
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 您希望如何实现这个功能？
      placeholder: |
        可以这样实现：
        - 添加新命令 `/omg xxx`
        - 修改现有命令 `diagnose` 的输出
        - 增加新的 Agent...

  - type: dropdown
    id: category
    attributes:
      label: 功能类别
      description: 这个功能属于哪个类别？
      options:
        - 新命令/模式
        - 现有命令改进
        - 知识库扩展（案例/玩法/理论）
        - 决策框架改进
        - CLI 工具改进
        - 文档改进
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 您考虑过哪些替代方案？
      placeholder: "例如：可以使用现有命令 xxx 实现，但不够直观..."

  - type: textarea
    id: examples
    attributes:
      label: 使用示例
      description: 如果已实现，您希望如何使用？
      placeholder: |
        ```
        /omg new-command 这里是参数...

        # 预期输出：
        ┌─────────────────────────────────────────────────────────┐
        │  📌 功能输出示例                                        │
        │  ...                                                    │
        └─────────────────────────────────────────────────────────┘
        ```

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 您认为这个功能有多重要？
      options:
        - 高 - 严重影响日常使用
        - 中 - 明显改善使用体验
        - 低 - 锦上添花
    validations:
      required: true

  - type: textarea
    id: contribution
    attributes:
      label: 贡献意愿
      description: 您是否愿意提交 PR 实现这个功能？
      placeholder: "是的，我可以提交 PR / 我可以提供测试用例 / 我只能描述需求..."

  - type: checkboxes
    id: checks
    attributes:
      label: 检查清单
      options:
        - label: 我已搜索 [existing issues](https://github.com/tinylion1024/oh-my-growth/issues)，确认这是新功能请求
          required: true
        - label: 我已阅读 [文档](./docs/)，确认当前没有类似功能
          required: false
