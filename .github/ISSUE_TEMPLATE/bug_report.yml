name: 🐛 Bug Report
description: 报告 oh-my-growth 插件的 Bug
title: "[Bug] "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢您报告 Bug！请填写以下信息帮助我们要快速定位问题。

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 清晰简洁地描述 Bug
      placeholder: "例如：运行 /omg-diagnose 时返回了错误的阶段判断"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 详细描述如何复现这个 Bug
      placeholder: |
        1. 在 Claude Code 中运行 `/omg-diagnose ...`
        2. 输入参数 `...`
        3. 观察输出
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 您期望发生什么？
      placeholder: "例如：应该输出正确的阶段诊断结果"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
      placeholder: "例如：输出了错误的阶段，日志显示..."
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: 使用的命令
      description: 您运行的完整命令
      placeholder: "/omg-diagnose My DAU dropped 20%, what should I do?"
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: 输出日志
      description: 请粘贴相关输出（可以截图或复制文本）
      placeholder: |
        ```
        粘贴输出内容...
        ```

  - type: input
    id: version
    attributes:
      label: 插件版本
      description: 查看 VERSION 文件或 manifest.json
      placeholder: "1.0.1"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python 版本
      description: 运行 `python3 --version` 获取
      placeholder: "3.10.0"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 使用模式
      description: 您是在哪个模式下遇到问题？
      options:
        - Claude Code 插件模式
        - CLI 命令行模式
        - 两者都有
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 检查清单
      options:
        - label: 我已搜索 [existing issues](https://github.com/tinylion1024/oh-my-growth/issues)，确认这是新问题
          required: true
        - label: 我已阅读 [文档](./docs/)，确认不是使用方式问题
          required: false

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 任何其他有助于解决问题的信息（截图、配置等）
