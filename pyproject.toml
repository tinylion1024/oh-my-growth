[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "growth-master-skill"
version = "1.0.1"
description = "Growth Master Skill - AI-powered growth decision support system for SEO, AEO, GEO, and LLM retrieval"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Growth Master Team"}
]
keywords = ["growth", "ai", "decision-support", "saas", "business", "seo", "geo", "aeo", "llm", "answer-engine-optimization"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
growth = "scripts.cli:main"
growth-e2e = "scripts.e2e_test_runner:main"
growth-verify = "scripts.verify_report:main"

[tool.setuptools]
include-package-data = true
packages = [
    "knowledge",
    "scripts",
    "scripts.gametheory",
    "scripts.kelly",
    "scripts.retriever",
    "scripts.strategy",
]

[tool.setuptools.package-data]
knowledge = [
    "STRUCTURE-SPEC.md",
    "cases/**/*.md",
    "failures/*.md",
    "frameworks/*.json",
    "guides/*.md",
    "indexes/*.json",
    "method-packs/*.md",
    "modules/**/*.md",
    "schools/*.md",
    "weapons/**/*.md",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
