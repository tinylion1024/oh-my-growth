[project]
name = "growth-master-skill"
version = "3.0.0"
description = "Growth Master Skill - AI-powered growth decision support system"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Growth Master Team"}
]
keywords = ["growth", "ai", "decision-support", "saas", "business"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
growth-e2e = "scripts.e2e_test_runner:main"
growth-verify = "scripts.verify_report:main"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
